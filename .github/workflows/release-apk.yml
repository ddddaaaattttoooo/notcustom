name: Build and publish Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/NotCustom-${GITHUB_REF_NAME#v}-release.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NotCustom ${{ github.ref_name }}
          prerelease: true
          body_path: RELEASE_NOTES.md
          files: release/NotCustom-*-release.apk
