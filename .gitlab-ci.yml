workflow:
  rules:
    - if: '$CI_COMMIT_REF_TYPE == "tag"'
    - when: never

stages:
  - release

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.58.0
  only:
    - tags
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: 'true'
  script:
    - APK_VERSION="${CI_COMMIT_TAG#v}"
    - APK_URL="https://github.com/ddddaaaattttoooo/notcustom/releases/download/${CI_COMMIT_TAG}/NotCustom-${APK_VERSION}-release.apk"
    - ASSETS="[{\"name\":\"Download Android APK\",\"url\":\"${APK_URL}\",\"link_type\":\"package\"}]"
    - NOTES="$(cat RELEASE_NOTES.md)"
    - glab release create "$CI_COMMIT_TAG" --name "NotCustom ${CI_COMMIT_TAG}" --notes "$NOTES" --assets-links="$ASSETS"
