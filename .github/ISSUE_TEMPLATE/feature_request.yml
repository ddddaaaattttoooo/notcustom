name: Feature request
description: Suggest an improvement to NotCustom
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What should be easier or possible?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like NotCustom to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Other context or examples
