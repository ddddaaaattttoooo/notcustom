name: Build and publish Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 34
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name release APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/NotCustom-${GITHUB_REF_NAME#v}-release.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/NotCustom-*-release.apk \
            --title "NotCustom $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
